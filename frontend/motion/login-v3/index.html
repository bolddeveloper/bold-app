<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BOLD · Fondo de acceso</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f2ef}main{position:relative;width:100%;height:100%;overflow:hidden}.art{position:absolute;inset:-3%;background:center/cover no-repeat url('assets/bold-login-light-v3.webp')}body.dark{background:#101112}body.dark .art{background-image:url('assets/bold-login-v3.webp')}@media(max-width:600px){.art{background-image:url('assets/bold-login-light-mobile-v3.webp')}body.dark .art{background-image:url('assets/bold-login-mobile-v3.webp')}}</style></head>
<body><main data-composition-id="main" data-start="0" data-duration="36" data-width="1920" data-height="1080" data-fps="30"><div class="art"></div></main>
<script>document.body.classList.toggle('dark',new URLSearchParams(location.search).get('theme')==='dark');window.__timelines=window.__timelines||{};const timeline=gsap.timeline({paused:true});timeline.fromTo('.art',{xPercent:-.7,yPercent:-.4,scale:1},{xPercent:.7,yPercent:.4,scale:1.035,duration:18,ease:'sine.inOut'}).to('.art',{xPercent:-.7,yPercent:-.4,scale:1,duration:18,ease:'sine.inOut'});window.__timelines.main=timeline;</script></body></html>
