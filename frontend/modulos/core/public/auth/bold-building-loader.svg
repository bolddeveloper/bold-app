<svg xmlns="http://www.w3.org/2000/svg" id="still" viewBox="0 0 320 280" role="img" aria-labelledby="title description">
  <title id="title">BOLD · Construyendo tu espacio</title>
  <desc id="description">Ocho bloques isométricos se ensamblan en cuatro niveles, descansan y vuelven a empezar.</desc>
  <style>
    :root { --top:#faf9f6; --left:#f2e9e5; --right:#eadbd7; --stud:#fff; }
    @media (prefers-color-scheme:dark) {
      :root { --top:#222326; --left:#1a1b1e; --right:#2a2023; --stud:#292a2d; }
    }
    .brick { animation-duration:4.2s; animation-timing-function:cubic-bezier(.32,0,.24,1); animation-iteration-count:infinite; }
    .brick-0 { --piece:0; --arrival-x:12px; animation-name:brick-0; }
    @keyframes brick-0 { 0% { opacity:0; transform:translate(12px,-24px); } 3% { opacity:1; } 14%,82% { opacity:1; transform:translate(0,0); } 100% { opacity:0; transform:translate(0,-8px); } }
    .brick-1 { --piece:1; --arrival-x:-12px; animation-name:brick-1; }
    @keyframes brick-1 { 0%,7% { opacity:0; transform:translate(-12px,-24px); } 10% { opacity:1; } 21%,82% { opacity:1; transform:translate(0,0); } 100% { opacity:0; transform:translate(0,-8px); } }
    .brick-2 { --piece:2; --arrival-x:12px; animation-name:brick-2; }
    @keyframes brick-2 { 0%,14% { opacity:0; transform:translate(12px,-24px); } 17% { opacity:1; } 28%,82% { opacity:1; transform:translate(0,0); } 100% { opacity:0; transform:translate(0,-8px); } }
    .brick-3 { --piece:3; --arrival-x:-12px; animation-name:brick-3; }
    @keyframes brick-3 { 0%,21% { opacity:0; transform:translate(-12px,-24px); } 24% { opacity:1; } 35%,82% { opacity:1; transform:translate(0,0); } 100% { opacity:0; transform:translate(0,-8px); } }
    .brick-4 { --piece:4; --arrival-x:12px; animation-name:brick-4; }
    @keyframes brick-4 { 0%,28% { opacity:0; transform:translate(12px,-24px); } 31% { opacity:1; } 42%,82% { opacity:1; transform:translate(0,0); } 100% { opacity:0; transform:translate(0,-8px); } }
    .brick-5 { --piece:5; --arrival-x:-12px; animation-name:brick-5; }
    @keyframes brick-5 { 0%,35% { opacity:0; transform:translate(-12px,-24px); } 38% { opacity:1; } 49%,82% { opacity:1; transform:translate(0,0); } 100% { opacity:0; transform:translate(0,-8px); } }
    .brick-6 { --piece:6; --arrival-x:12px; animation-name:brick-6; }
    @keyframes brick-6 { 0%,42% { opacity:0; transform:translate(12px,-24px); } 45% { opacity:1; } 56%,82% { opacity:1; transform:translate(0,0); } 100% { opacity:0; transform:translate(0,-8px); } }
    .brick-7 { --piece:7; --arrival-x:-12px; animation-name:brick-7; }
    @keyframes brick-7 { 0%,49% { opacity:0; transform:translate(-12px,-24px); } 52% { opacity:1; } 63%,82% { opacity:1; transform:translate(0,0); } 100% { opacity:0; transform:translate(0,-8px); } }
    #entry:target .brick { animation-name:brick-entry; animation-duration:560ms; animation-delay:calc(var(--piece) * 180ms); animation-iteration-count:1; animation-fill-mode:both; }
    @keyframes brick-entry { from { opacity:0; transform:translate(var(--arrival-x),-24px); } 25% { opacity:1; } to { opacity:1; transform:translate(0,0); } }
    #still:target .brick { animation:none; }
    @media (prefers-reduced-motion:reduce) { .brick { animation:none!important; } }
  </style>
  <defs>
    <g id="brick" stroke="#e73535" stroke-width="1" stroke-linejoin="round">
      <path d="M-34 17 34 51V65L-34 31Z" fill="var(--left)"/>
      <path d="M34 51 68 34V48L34 65Z" fill="var(--right)"/>
      <path d="M0 0 68 34 34 51-34 17Z" fill="var(--top)"/>
      <g fill="var(--stud)">
        <path d="M-11 12V17A11 5 0 0 0 11 17V12"/>
        <ellipse cx="0" cy="12" rx="11" ry="5"/>
        <path d="M23 29V34A11 5 0 0 0 45 34V29"/>
        <ellipse cx="34" cy="29" rx="11" ry="5"/>
      </g>
    </g>
  </defs>
  <g id="entry">
  <g transform="translate(160 142)"><g class="brick brick-0"><use href="#brick"/></g></g>
  <g transform="translate(126 159)"><g class="brick brick-1"><use href="#brick"/></g></g>
  <g transform="translate(160 128)"><g class="brick brick-2"><use href="#brick" transform="scale(-1 1)"/></g></g>
  <g transform="translate(194 145)"><g class="brick brick-3"><use href="#brick" transform="scale(-1 1)"/></g></g>
  <g transform="translate(160 114)"><g class="brick brick-4"><use href="#brick"/></g></g>
  <g transform="translate(126 131)"><g class="brick brick-5"><use href="#brick"/></g></g>
  <g transform="translate(160 100)"><g class="brick brick-6"><use href="#brick" transform="scale(-1 1)"/></g></g>
  <g transform="translate(194 117)"><g class="brick brick-7"><use href="#brick" transform="scale(-1 1)"/></g></g>
  </g>
</svg>
