<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<style>
.frame{fill:none;stroke:#888;stroke-width:1;opacity:.35}.ring{fill:none;stroke:#e73535;stroke-width:18;stroke-dasharray:327;transform:rotate(-90deg);transform-origin:128px 128px;animation:draw 1.2s cubic-bezier(.2,.8,.2,1) both}.guide{fill:none;stroke:#888;stroke-width:1;opacity:0;animation:guide 1.2s ease both}
@keyframes draw{0%{stroke-dashoffset:327;opacity:0}12%{opacity:1}72%,100%{stroke-dashoffset:0;opacity:1}}
@keyframes guide{0%{opacity:0;transform:translateY(8px)}25%,65%{opacity:.35}100%{opacity:0;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.ring,.guide{animation:none}.ring{stroke-dashoffset:0}.guide{opacity:0}}
</style>
