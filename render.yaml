# Blueprint de Render para la infraestructura dinamica de boldApp: backend
# (API REST + WebSocket), worker de Celery (webhooks salientes), Redis
# (channel layer + cola de Celery) y Postgres. El frontend se publica desde
# Cloudflare Pages siguiendo CLOUDFLARE_DEPLOYMENT.md.
#
# Uso: en el dashboard de Render, "New" > "Blueprint", conectar este repo.
# Render lee este archivo y crea los 4 recursos de abajo.
#
# IMPORTANTE: Render asigna el subdominio *.onrender.com segun el "name" de
# cada servicio, siempre que no este ya tomado por otra cuenta. No existe en
# el spec de blueprints una forma de referenciar la URL publica con esquema
# (https://...) de un servicio desde otro. Los valores asumen los dominios
# recomendados app.bold.gt y api.bold.gt. Cambialos si el despliegue utiliza
# otros subdominios y conserva siempre origenes exactos (sin comodines).
#
# Los "plan" de abajo son el nivel gratuito/mas chico disponible al momento
# de escribir esto; ajustalos segun lo que tengas habilitado en tu cuenta.

databases:
  - name: bold-app-db
    databaseName: boldapp
    user: boldapp
    plan: free

services:
  - type: keyvalue
    name: bold-app-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

  - type: web
    name: bold-app-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    preDeployCommand: "python manage.py migrate"
    startCommand: "daphne -b 0.0.0.0 -p $PORT config.asgi:application"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: AUTH_ENCRYPTION_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: ALLOWED_HOSTS
        value: "api.bold.gt,bold-app-backend.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://app.bold.gt"
      - key: FRONTEND_URL
        value: "https://app.bold.gt"
      - key: AUTH_SESSION_COOKIE_SAMESITE
        value: "Lax"
      # Activar después de validar el enrolamiento de las cuentas existentes.
      - key: AUTH_MFA_REQUIRED
        value: "false"
      - key: AUTH_NUM_PROXIES
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: bold-app-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bold-app-redis
          property: connectionString
  - type: worker
    name: bold-app-worker
    runtime: python
    # Render no ofrece workers gratuitos. Este es su plan de entrada actual.
    plan: 0.5c-512mb
    rootDir: backend
    buildCommand: "pip install -r requirements.txt"
    startCommand: "celery -A config worker --loglevel=info"
    envVars:
      - key: SECRET_KEY
        fromService:
          type: web
          name: bold-app-backend
          envVarKey: SECRET_KEY
      - key: AUTH_ENCRYPTION_KEY
        fromService:
          type: web
          name: bold-app-backend
          envVarKey: AUTH_ENCRYPTION_KEY
      - key: DJANGO_DEBUG
        value: "false"
      - key: PYTHON_VERSION
        value: "3.11.15"
      - key: DATABASE_URL
        fromDatabase:
          name: bold-app-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: bold-app-redis
          property: connectionString
# El frontend se compila y publica de forma independiente en Cloudflare Pages.
