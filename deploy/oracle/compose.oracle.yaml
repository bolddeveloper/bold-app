name: bold-app

x-backend-image: &backend-image
  image: "bold-app-backend:${BOLD_APP_IMAGE_TAG:-latest}"
  build:
    context: ../../backend
    dockerfile: Dockerfile

x-backend-environment: &backend-environment
  DATABASE_URL: "postgresql://${POSTGRES_USER:?POSTGRES_USER requerido}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}@postgres:5432/${POSTGRES_DB:?POSTGRES_DB requerido}"
  REDIS_URL: "redis://:${REDIS_PASSWORD:?REDIS_PASSWORD requerido}@redis:6379/0"
  DJANGO_DEBUG: "${DJANGO_DEBUG:-false}"
  SECRET_KEY: "${SECRET_KEY:?SECRET_KEY requerido}"
  AUTH_ENCRYPTION_KEY: "${AUTH_ENCRYPTION_KEY:?AUTH_ENCRYPTION_KEY requerido}"
  ALLOWED_HOSTS: "${ALLOWED_HOSTS:-api.bold.gt}"
  CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-https://app.bold.gt}"
  FRONTEND_URL: "${FRONTEND_URL:-https://app.bold.gt}"
  GOOGLE_WORKSPACE_REDIRECT_URI: "${GOOGLE_WORKSPACE_REDIRECT_URI:-}"
  GOOGLE_CALENDAR_CLIENT_ID: "${GOOGLE_CALENDAR_CLIENT_ID:-}"
  GOOGLE_CALENDAR_CLIENT_SECRET: "${GOOGLE_CALENDAR_CLIENT_SECRET:-}"
  GOOGLE_CALENDAR_REDIRECT_URI: "${GOOGLE_CALENDAR_REDIRECT_URI:-}"
  HEALTHCHECK_HOST: "${HEALTHCHECK_HOST:-api.bold.gt}"
  TRUST_CLOUDFLARE_CONNECTING_IP: "${TRUST_CLOUDFLARE_CONNECTING_IP:-true}"
  AUTH_NUM_PROXIES: "${AUTH_NUM_PROXIES:-0}"
  AUTH_SESSION_COOKIE_NAME: "${AUTH_SESSION_COOKIE_NAME:-bold_session}"
  AUTH_SESSION_COOKIE_SAMESITE: "${AUTH_SESSION_COOKIE_SAMESITE:-Lax}"
  AUTH_SESSION_TIME_ZONE: "${AUTH_SESSION_TIME_ZONE:-America/Guatemala}"
  AUTH_SESSION_CUTOFF_TIME: "${AUTH_SESSION_CUTOFF_TIME:-07:00}"
  AUTH_SESSION_IDLE_SECONDS: "${AUTH_SESSION_IDLE_SECONDS:-0}"
  AUTH_MFA_REQUIRED: "${AUTH_MFA_REQUIRED:-false}"
  AUTH_CHALLENGE_TTL_SECONDS: "${AUTH_CHALLENGE_TTL_SECONDS:-3600}"
  AUTH_INVITATION_TTL_SECONDS: "${AUTH_INVITATION_TTL_SECONDS:-259200}"
  AUTH_WEBSOCKET_TICKET_TTL_SECONDS: "${AUTH_WEBSOCKET_TICKET_TTL_SECONDS:-45}"
  ADMIN_STEP_UP_MFA_SECONDS: "${ADMIN_STEP_UP_MFA_SECONDS:-600}"
  ADMIN_TEMPORARY_PASSWORD_ENABLED: "${ADMIN_TEMPORARY_PASSWORD_ENABLED:-false}"
  PERMISSIONS_STEP_UP_MFA_SECONDS: "${PERMISSIONS_STEP_UP_MFA_SECONDS:-600}"
  PERMISSIONS_AUTHORITY_MAX_SECONDS: "${PERMISSIONS_AUTHORITY_MAX_SECONDS:-7776000}"
  SEED_DEMO_ACCOUNTS: "${SEED_DEMO_ACCOUNTS:-false}"
  SEED_PRIVILEGED_DEMO_ACCOUNTS: "${SEED_PRIVILEGED_DEMO_ACCOUNTS:-false}"
  CELERY_TASK_ALWAYS_EAGER: "${CELERY_TASK_ALWAYS_EAGER:-false}"
  SECURE_HSTS_SECONDS: "${SECURE_HSTS_SECONDS:-31536000}"
  SECURE_HSTS_INCLUDE_SUBDOMAINS: "${SECURE_HSTS_INCLUDE_SUBDOMAINS:-false}"
  EMAIL_BACKEND: "${EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}"
  EMAIL_HOST: "${EMAIL_HOST:-localhost}"
  EMAIL_PORT: "${EMAIL_PORT:-587}"
  EMAIL_USE_TLS: "${EMAIL_USE_TLS:-true}"
  EMAIL_USE_SSL: "${EMAIL_USE_SSL:-false}"
  EMAIL_HOST_USER: "${EMAIL_HOST_USER:-}"
  EMAIL_HOST_PASSWORD: "${EMAIL_HOST_PASSWORD:-}"
  DEFAULT_FROM_EMAIL: "${DEFAULT_FROM_EMAIL:-no-reply@bold.gt}"

x-backend-security: &backend-security
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB requerido}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER requerido}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requerido}"
    volumes:
      # PostgreSQL 18 usa un directorio versionado bajo /var/lib/postgresql.
      # Montar el padre conserva los datos y permite futuras actualizaciones
      # controladas con pg_upgrade.
      - postgres_data:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD requerido}"
    command:
      - sh
      - -c
      - exec redis-server --appendonly yes --appendfsync everysec --requirepass "$$REDIS_PASSWORD"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  backend:
    <<: [*backend-image, *backend-security]
    restart: unless-stopped
    init: true
    environment: *backend-environment
    command:
      - sh
      - -c
      - python manage.py migrate --noinput && exec daphne -b 0.0.0.0 -p 8000 config.asgi:application
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging

  worker:
    <<: [*backend-image, *backend-security]
    restart: unless-stopped
    init: true
    # La imagen compartida comprueba el endpoint HTTP de Daphne. Celery no
    # publica HTTP, por lo que ese healthcheck produciria un falso negativo.
    healthcheck:
      disable: true
    environment: *backend-environment
    command: ["celery", "-A", "config", "worker", "-B", "--schedule=/tmp/celerybeat-schedule", "--loglevel=info", "--concurrency=2"]
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 60s
    logging: *default-logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--loglevel", "info", "run"]
    environment:
      TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN requerido}"
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
